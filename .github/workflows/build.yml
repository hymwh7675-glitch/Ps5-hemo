name: Build PS5 Payload

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup PS5 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc

      - name: Compile Payload
        run: |
          gcc -o payload.elf main.c

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ps5-payload
          path: payload.elf

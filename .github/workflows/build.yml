name: Build PS5 Payload

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PS5 SDK & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-orbis || true

      - name: Compile Payload
        run: |
          make || gcc -s -O2 -shared -o payload.elf main.c

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-payload
          path: "*.elf"
